<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASK AI by 4elobrek9</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span>ASK AI <span class="brand-by">by 4elobrek9</span></span>
    </div>
    <div class="topbar-actions">
      <button id="theme" class="icon-btn theme-toggle" type="button" aria-label="Сменить тему" title="Сменить тему" aria-pressed="false">
        <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6m12 12 1.4 1.4M2.5 12h2m15 0h2M4.6 19.4 6 18m12-12 1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.2 15.4A8 8 0 0 1 8.6 4.8 8.2 8.2 0 1 0 19.2 15.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-new-chat" class="new-chat-btn" title="Начать новый чат">
        <span aria-hidden="true">＋</span> <span data-i18n="chat.new">Новый чат</span>
      </button>
      <button id="btn-options" class="icon-btn" title="Настройки" data-i18n-title="settings.open">
        <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="controls">
    <details id="history-menu" class="history-menu">
      <summary class="icon-btn" aria-label="История чатов" data-i18n-aria-label="history.label" title="История чатов" data-i18n-title="history.label">
        <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </summary>
      <div id="chat-history" class="history-list"></div>
    </details>
    <button id="btn-analyze" class="btn primary" title="Прочитать страницу и предложить 3 вопроса">
      <span data-i18n="analyze.page">Прочитать страницу</span>
    </button>
  </div>

  <main id="messages" class="messages" aria-live="polite"></main>

  <section id="chips" class="chips liquid-glass is-collapsed" aria-label="Предложенные вопросы" data-i18n-aria-label="questions.title" aria-hidden="true" inert>
    <div class="chips-heading">
      <span data-i18n="questions.title">Вопросы по теме</span>
      <button id="close-questions" class="icon-btn tiny close-questions" type="button" aria-label="Закрыть все вопросы" title="Закрыть все вопросы">
        <span aria-hidden="true">✕</span>
      </button>
    </div>
    <div id="question-items" class="question-items"></div>
  </section>

  <div id="status" class="status hidden">
    <span class="spinner" aria-hidden="true"></span>
    <span id="status-text">Думаю…</span>
  </div>

  <nav class="sourcebar" aria-label="Источники и чат">
    <details id="source-picker" class="source-picker">
      <summary aria-label="Источники и чат" data-i18n-aria-label="source.label"><span id="source-summary">Эта вкладка</span><span aria-hidden="true">⌄</span></summary>
      <div id="source-list" class="source-list"></div>
      <p class="source-help" data-i18n="source.help">Выберите страницы для кнопки «Прочитать».</p>
    </details>
  </nav>

  <footer class="composer">
    <textarea id="input" rows="1" placeholder="Спросите что-нибудь..." data-i18n-placeholder="input.placeholder"></textarea>
    <button id="btn-send" class="round-btn send" title="Отправить (Enter)" data-i18n-title="send.title">
      <svg width="17" height="17" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="btn-stop" class="round-btn stop hidden" title="Остановить (Esc)" data-i18n-title="stop.title">
      <svg width="14" height="14" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
    </button>
  </footer>

  <div class="footnote"><span id="provider-hint"></span></div>

  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
